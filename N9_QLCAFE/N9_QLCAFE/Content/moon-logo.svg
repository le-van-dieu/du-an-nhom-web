<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7ff" />
    </linearGradient>

    <!-- Golden Moon Gradient -->
    <linearGradient id="moonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Coffee Cup Blue Gradient -->
    <linearGradient id="cupBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c83f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Container Rounded Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#dbeafe" stroke-width="2" filter="url(#logoShadow)" />

  <!-- Crescent Moon (Nghệ thuật Trăng Khuyết Ôm Tách Cà Phê) -->
  <path d="M 62 18 C 36 18 18 38 18 64 C 18 88 38 104 62 104 C 44 96 34 82 34 64 C 34 46 44 30 62 18 Z" 
        fill="url(#moonGold)" />

  <!-- Coffee Cup Base -->
  <path d="M 44 56 L 86 56 C 86 78 72 84 65 84 L 65 84 C 56 84 44 78 44 56 Z" 
        fill="url(#cupBlue)" />

  <!-- Cup Rim Accent -->
  <ellipse cx="65" cy="56" rx="21" ry="3" fill="#60a5fa" />

  <!-- Cup Handle -->
  <path d="M 84 61 C 94 61 97 68 95 74 C 93 80 86 80 81 79" 
        fill="none" stroke="url(#cupBlue)" stroke-width="5" stroke-linecap="round" />

  <!-- Saucer Under Cup -->
  <path d="M 38 88 C 54 94 76 94 92 88" 
        fill="none" stroke="url(#cupBlue)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Aromatic Steam (Làn Khói Thơm Uốn Lượn) -->
  <path d="M 54 48 C 51 40 59 34 56 26" 
        fill="none" stroke="url(#moonGold)" stroke-width="3" stroke-linecap="round" />
  <path d="M 65 49 C 62 39 71 33 67 22" 
        fill="none" stroke="url(#cupBlue)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 76 48 C 73 41 80 36 78 28" 
        fill="none" stroke="url(#moonGold)" stroke-width="3" stroke-linecap="round" />

  <!-- Sparkle Stars (Ngôi sao ánh trăng) -->
  <path d="M 82 18 Q 82 25 89 25 Q 82 25 82 32 Q 82 25 75 25 Q 82 25 82 18 Z" 
        fill="url(#moonGold)" />
  <circle cx="95" cy="38" r="2.5" fill="#f59e0b" />
</svg>
